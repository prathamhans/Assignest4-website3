<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Design</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="main-wrapper">
        <aside class="sidebar">
            <span class="sidebar-text">Podcast</span>
            <span class="sidebar-text">Portfolio</span>
            <span class="sidebar-text">Research</span>
            <span class="sidebar-text">Clients</span>
        </aside>

        <section class="about-card">
            <div class="corner-cutout">
                <i class="fa-solid fa-crosshairs icon-spin"></i> About Me
            </div>

            <div class="profile-section">
                <div class="outer-ring">
                    <div class="inner-circle">
                        <!-- Placeholder for the man's face -->
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80"
                            alt="Jon Daniel">
                    </div>
                </div>
            </div>

            <div class="about-footer">
                <div class="name-section">
                    <h2>Im,<br>Jon<br>Daniel</h2>
                    <p>inquiry@jondaniel.design <i class="fa-regular fa-envelope"></i></p>
                </div>
                <div class="record-badge">
                    <svg viewBox="0 0 100 100" width="80" height="80">
                        <circle cx="50" cy="50" r="48" fill="#111" />
                        <path id="circlePath" d="M 50, 50 m -32, 0 a 32,32 0 1,1 64,0 a 32,32 0 1,1 -64,0"
                            fill="transparent" />
                        <text font-size="9.5" font-weight="700" fill="white" letter-spacing="1.5">
                            <textPath href="#circlePath" startOffset="50%" text-anchor="middle">2020 MY DESIGN PORTFOLIO
                            </textPath>
                        </text>
                        <circle cx="50" cy="50" r="14" fill="#8b8ad5" />
                        <circle cx="50" cy="50" r="4" fill="#111" />
                    </svg>
                </div>
            </div>
        </section>

        <section class="right-content">
            <div class="top-bar">
                <h1 class="page-title">Portfolio<span class="corner-bracket"></span></h1>
            </div>

            <div class="grid-container">
                <div class="grid-item flamingo-card">
                    <img src="birdimg.webp" alt="birdimage">
                    <div class="play-button">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <span class="corner-bracket"></span>
                </div>

                <div class="grid-item projects-card">
                    <h3>251</h3>
                    <p>Projects</p>
                    <span class="corner-bracket"></span>
                </div>

                <div class="grid-item awards-card">
                    <h3>156</h3>
                    <p>Awards</p>
                    <span class="corner-bracket"></span>
                </div>

                <div class="grid-item clients-card">
                    <i class="fa-brands fa-apple apple-logo"></i>
                    <p>Clients</p>
                    <span class="corner-bracket"></span>
                </div>

                <div class="grid-item sphere-card">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80"
                        alt="3D Sphere">
                </div>

                <div class="grid-item global-awards-card">
                    <h3>172</h3>
                    <p>Global Design<br>Awards.</p>
                    <span class="corner-bracket"></span>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
